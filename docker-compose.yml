services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sm
      POSTGRES_PASSWORD: sm
      POSTGRES_DB: sladkiy_most
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm -d sladkiy_most"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sm:sm@db:5432/sladkiy_most
      JWT_SECRET: ${JWT_SECRET:-change-me-local-secret-at-least-32-chars}
      ADMIN_PHONE: ${ADMIN_PHONE:-+7 900 000-00-00}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SITE_URL: http://localhost:3000
      API_URL: http://localhost:8000
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads:/app/uploads]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
